    <title>Chance Cooper</title>

    <!-- Main CSS -->
    <link rel="stylesheet" type="text/css" href="css/main_style.css">

</head>

<body>

    <div id="body-container">

        <div id="header">

            <script src="javascript/external.js"></script>

            <script>
                document.write(welcome());
            </script>

        </div>

        <div id="profile-picture">
            <img src="images/profile-picture.jpg" width="250" height="250">
        </div>

        <div id="welcome-text">
            <p>
                My name is Chance Cooper.<br>
                Welcome to my webpage.<br>
                I am a student in the
                <a href="https://www.geo.txstate.edu/" target="_blank">
                    Department of Physical Geography
                </a> at
                <a href="https://www.txst.edu/" target="_blank">
                    Texas State University
                </a>.
            </p>
        </div>

        <div id="research-interests">
            <h3>Research Interests:</h3>

            <ol>
                <li>GIS</li>
                <li>Remote Sensing</li>
                <li>Wildland Firefighting</li>
            </ol>
        </div>

        <div id="webmap-reviews">
            <p>
                <h3>Webmap Reviews</h3>

                <script>
                    document.write(webmap_table());
                </script>
            </p>
        </div>

        <h3>Seven Wonders of the World</h3>
        <br>

        <div id="mapid" style="width: 600px; height: 400px; margin: auto; bottom: 30px;">

            <script>

                var mymap = L.map('mapid').setView([20, 10], 2);

                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                }).addTo(mymap);


                // Taj Mahal Icon
                var tajIcon = L.divIcon({
                    html: "🕌",
                    className: "",
                    iconSize: [30, 30]
                });

                // Great Wall Icon
                var wallIcon = L.divIcon({
                    html: "🧱",
                    className: "",
                    iconSize: [30, 30]
                });

                // Petra Icon
                var petraIcon = L.divIcon({
                    html: "🏛️",
                    className: "",
                    iconSize: [30, 30]
                });

                // Christ the Redeemer Icon
                var christIcon = L.divIcon({
                    html: "✝️",
                    className: "",
                    iconSize: [30, 30]
                });

                // Machu Picchu Icon
                var machuIcon = L.divIcon({
                    html: "⛰️",
                    className: "",
                    iconSize: [30, 30]
                });

                // Chichen Itza Icon
                var chichenIcon = L.divIcon({
                    html: "🔺",
                    className: "",
                    iconSize: [30, 30]
                });

                // Colosseum Icon
                var colosseumIcon = L.divIcon({
                    html: "🏟️",
                    className: "",
                    iconSize: [30, 30]
                });


                // Taj Mahal - India
                var tajMahal = L.marker(
                    [27.174961, 78.042385],
                    {icon: tajIcon}
                ).addTo(mymap);

                // Great Wall of China
                var greatWall = L.marker(
                    [40.334245, 116.477652],
                    {icon: wallIcon}
                ).addTo(mymap);

                // Petra - Jordan
                var petra = L.marker(
                    [30.328611, 35.441944],
                    {icon: petraIcon}
                ).addTo(mymap);

                // Christ the Redeemer - Brazil
                var christRedeemer = L.marker(
                    [-22.951389, -43.2108334],
                    {icon: christIcon}
                ).addTo(mymap);

                // Machu Picchu - Peru
                var machuPicchu = L.marker(
                    [-13.163056, -72.545556],
                    {icon: machuIcon}
                ).addTo(mymap);

                // Chichen Itza - Mexico
                var chichenItza = L.marker(
                    [20.682778, -88.569167],
                    {icon: chichenIcon}
                ).addTo(mymap);

                // Colosseum - Rome
                var colosseum = L.marker(
                    [41.890169, 12.492269],
                    {icon: colosseumIcon}
                ).addTo(mymap);

            </script>

        </div>

        <div id="copyright">

            <script>
                // Gets the current date.
                var today = new Date();

                // Gets the current year from the date.
                var year = today.getFullYear();

                // Displays the copyright symbol and current year.
                document.writeln("Copyright &copy; " + year);
            </script>

        </div>

    </div>

</body>
</html>
